<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">NeGcon enhanced dual sticks: default controller configuration</title>
<desc id="desc">Analog steering on left stick. Right stick controls pitch and reversed air-brakes. Right trigger accelerates. Shoulder buttons retain left and right air-brakes. Numbered labels describe each control below.</desc>
