<rect x="60" y="574" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="85" cy="600" r="16" fill="#58e0c0"/><text x="85" y="606" class="num">1</text>
<text x="110" y="606" class="head">Left stick</text><text x="80" y="635" class="body">Left / right: analog steering</text><text x="80" y="661" class="body">Up / down: unassigned</text>
<rect x="560" y="574" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="585" cy="600" r="16" fill="#58e0c0"/><text x="585" y="606" class="num">2</text>
<text x="610" y="606" class="head">Right stick</text><text x="580" y="635" class="body">Up / down: pitch inputs</text><text x="580" y="661" class="body">Left: RIGHT brake · Right: LEFT brake</text>
<rect x="1060" y="574" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="1085" cy="600" r="16" fill="#58e0c0"/><text x="1085" y="606" class="num">3</text>
<text x="1110" y="606" class="head">Right trigger</text><text x="1080" y="635" class="body">Analog acceleration (NeGcon I)</text><text x="1080" y="661" class="body">Digital triggers give full acceleration</text>
<rect x="60" y="690" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="85" cy="716" r="16" fill="#58e0c0"/><text x="85" y="722" class="num">4</text>
<text x="110" y="722" class="head">Shoulder buttons</text><text x="80" y="751" class="body">LB / L1 / L: LEFT air-brake</text><text x="80" y="777" class="body">RB / R1 / R: RIGHT air-brake</text>
<rect x="560" y="690" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="585" cy="716" r="16" fill="#58e0c0"/><text x="585" y="722" class="num">5</text>
<text x="610" y="722" class="head">Left trigger</text><text x="580" y="751" class="body">Fire equipped weapon</text><text x="580" y="777" class="body">NeGcon II pressure</text>
<rect x="1060" y="690" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="1085" cy="716" r="16" fill="#58e0c0"/><text x="1085" y="722" class="num">6</text>
<text x="1110" y="722" class="head">Bottom face · S</text><text x="1080" y="751" class="body">Full acceleration / menu select</text><text x="1080" y="777" class="body">Xbox A · PS Cross · Switch B</text>
<rect x="60" y="806" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="85" cy="832" r="16" fill="#58e0c0"/><text x="85" y="838" class="num">7</text>
<text x="110" y="838" class="head">Right face · E</text><text x="80" y="867" class="body">Discard weapon (NeGcon A)</text><text x="80" y="893" class="body">Xbox B · PS Circle · Switch A</text>
<rect x="560" y="806" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="585" cy="832" r="16" fill="#58e0c0"/><text x="585" y="838" class="num">8</text>
<text x="610" y="838" class="head">Top face · N</text><text x="580" y="867" class="body">Change view / menu back (NeGcon B)</text><text x="580" y="893" class="body">Xbox Y · PS Triangle · Switch X</text>
<rect x="1060" y="806" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="1085" cy="832" r="16" fill="#58e0c0"/><text x="1085" y="838" class="num">9</text>
<text x="1110" y="838" class="head">Left face · W</text><text x="1080" y="867" class="body">Fire equipped weapon (NeGcon II)</text><text x="1080" y="893" class="body">Xbox X · PS Square · Switch Y</text>
<rect x="60" y="922" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="85" cy="948" r="16" fill="#58e0c0"/><text x="85" y="954" class="num">10</text>
<text x="110" y="954" class="head">D-pad</text><text x="80" y="983" class="body">Menu navigation</text><text x="80" y="1009" class="body">Original directional inputs retained</text>
<rect x="560" y="922" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="585" cy="948" r="16" fill="#58e0c0"/><text x="585" y="954" class="num">11</text>
<text x="610" y="954" class="head">Start / Menu / Options / +</text><text x="580" y="983" class="body">Start / pause</text><text x="580" y="1009" class="body">Right-center button</text>
<rect x="1060" y="922" width="480" height="103" rx="12" fill="#132237"/>
<circle cx="1085" cy="948" r="16" fill="#58e0c0"/><text x="1085" y="954" class="num">12</text>
<text x="1110" y="954" class="head">Back / View / Create / −</text><text x="1080" y="983" class="body">No NeGcon Select button</text><text x="1080" y="1009" class="body">Stick clicks / Home: no game action</text>
<text x="70" y="1085" class="sub">The right-stick brake directions are intentionally reversed. Shoulder brakes keep their normal directions.</text><text x="70" y="1118" class="sub">Face-button actions follow the game’s NeGcon settings. Mod choices and input.ini can change this preset.</text></svg>