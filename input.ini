; SDL positional controls: south/east/west/north become Cross/Circle/Square/Triangle.
[controller]
enabled = true
device = 0
deadzone = 3277
[mapping]
up = dpup, righty-
down = dpdown, righty+
left = dpleft, leftx-
right = dpright, leftx+
cross = a
circle = b
square = x
triangle = y
l1 = leftshoulder, rightx+
r1 = rightshoulder, rightx-
l2 = lefttrigger
r2 = righttrigger
l3 = leftstick
r3 = rightstick
start = start
select = back
ls_up = none
ls_down = none
ls_left = leftx-
ls_right = leftx+
rs_up = righty-
rs_down = righty+
rs_left = rightx-
rs_right = rightx+
