; Wipeout XL defaults: physical WASD plus arrow keys for direction.
; PSX button names are used so in-game remapping remains authoritative.
[player1]
up = W, Up
down = S, Down
left = A, Left
right = D, Right
cross = Space, X
square = Left Shift, Z
triangle = C
circle = Left Ctrl
l1 = Q
r1 = E
l2 = F
r2 = R
l3 = T
r3 = Y
start = Return
select = Backspace
ls_up = W, Up
ls_down = S, Down
ls_left = A, Left
ls_right = D, Right
