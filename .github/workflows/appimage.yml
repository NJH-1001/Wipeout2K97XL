name: Steam Deck AppImage
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Successful native build run containing the checksum-pinned Linux kit'
        required: false
        type: string
permissions:
  contents: read
  actions: read
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libopengl0 libgl1-mesa-dri squashfs-tools desktop-file-utils xvfb xdotool imagemagick
      - name: Bootstrap persistence and input policy tests
        run: python tools/test_appimage_launcher.py
      - name: Fetch verified Linux kit from native CI
        if: inputs.native_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: python tools/fetch_appimage_linux_kit.py "$NATIVE_RUN_ID"
      - name: Build from checksum-pinned Linux kit
        run: python tools/package_appimage.py
      - name: Audit and test single-file launcher
        run: xvfb-run -a python tools/audit_appimage.py dist/*.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: wipeoutxl-steamdeck-appimage
          path: |
            dist/*.AppImage
            dist/*.sha256
            dist/appimage-build-proof.json
            appimage-launcher.png
          if-no-files-found: error
