name: Windows setup kit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-python mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-vulkan-headers mingw-w64-x86_64-shaderc
            zip curl git
      - name: Apply framework changes
        shell: bash
        run: git -c core.autocrlf=true -C psxrecomp apply ../patches/psxrecomp.patch
      - name: HUD packet guard regression
        run: |
          gcc -Wall -Wextra -Werror tools/test_hud_packet.c -o hud-packet-test
          ./hud-packet-test
      - name: Build emitters and setup host
        run: |
          set -euo pipefail
          cmake -S psxrecomp/recompiler -B build-recompiler -G Ninja -DCMAKE_BUILD_TYPE=Release -DPSXRECOMP_STATIC_CLI=ON
          cmake --build build-recompiler --target psxrecomp-game psxrecomp-bios -j4
          cmake -S . -B build-ci -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DPSXRECOMP_FORCE_SETUP_HOST=ON -DPSXRECOMP_ALLOW_NO_BIOS=ON -DPSX_GAME_VERSION="$(cat VERSION)"
          cmake --build build-ci --target psx-runtime -j4
      - name: Package and audit
        env:
          PSXRECOMP_RUNTIME_BIN_DIR: /mingw64/bin
          EXCLUDE_DEV_MODS: '1'
        run: |
          set -euo pipefail
          bash scripts/package_setup_release.sh build-ci windows-x64 build-recompiler
          python tools/audit_release.py dist/wipeoutxl-*-windows-x64.zip
          python tools/audit_hud_release.py dist/wipeoutxl-*-windows-x64.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wipeoutxl-windows-x64
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
