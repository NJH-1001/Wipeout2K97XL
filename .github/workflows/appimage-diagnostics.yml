name: AppImage newer-host comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libopengl0 libgl1-mesa-dri xvfb xdotool imagemagick
      - run: xvfb-run -a python tools/diagnose_appimage_host.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: appimage-host-diagnostic
          path: |
            build-appimage-host-diagnostic/result.json
            build-appimage-host-diagnostic/*.png
