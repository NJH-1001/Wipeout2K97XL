format_version = 5
id = "wxl.presentation.track-distance"
version = "1.0.0"
name = "Extended Draw Distance"
author = "Wipeout2K97XL project"
description = "Extend distant roads, scenery meshes, billboard sprites and enemy ships."
resolver = "declarative"
save_compatibility = "shared"

[[target]]
game_id = "SCUS-94351"

[[feature]]
id = "distance"
name = "Extended Draw Distance"
description = "Add road, scenery meshes and billboard sprites up to 64000 depth units. Off by default."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "distance"
id = "wxl.track-distance"

[[feature]]
id = "ships"
name = "Extended Enemy Ship Distance"
description = "Extend ship meshes to the scenery range when Extended Draw Distance is also enabled. Normal races; off by default, requires restart."
group = "Visual"
default_enabled = false

[[plugin]]
feature = "ships"
id = "wxl.ship-distance"
